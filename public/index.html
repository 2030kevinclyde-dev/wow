<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      height: 100vh;
      overflow: hidden;
      width: 100%;
    }

    .blank-area {
      height: 100%;
      inset: 0;
      position: fixed;
      width: 100%;
    }

    .container {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 10px 45px rgba(0, 0, 0, 0.35);
      display: none;
      left: 50%;
      max-width: 500px;
      padding: 20px;
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(90vw, 500px);
      z-index: 2;
    }

    .container.active {
      animation: pop-in 180ms ease-out;
      display: block;
    }

    @keyframes pop-in {
      from {
        opacity: 0;
        transform: translate(-50%, -48%);
      }
      to {
        opacity: 1;
        transform: translate(-50%, -50%);
      }
    }

    .input-group {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    input[type='text'] {
      border: 2px solid #d6d6d6;
      border-radius: 6px;
      flex: 1;
      font-size: 14px;
      padding: 11px 12px;
    }

    input[type='text']:focus {
      border-color: #2b2b2b;
      outline: none;
    }

    button {
      background: #1f1f1f;
      border: 0;
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      padding: 11px 20px;
    }

    button:hover {
      background: #2b2b2b;
    }
  </style>
</head>
<body>
  <div class="blank-area"></div>

  <div class="container" id="launcher">
    <div class="input-group">
      <input id="urlInput" type="text" placeholder="https://example.com" />
      <button id="openButton" type="button">Go</button>
    </div>
  </div>

  <script>
    const launcher = document.getElementById('launcher');
    const urlInput = document.getElementById('urlInput');
    const openButton = document.getElementById('openButton');

    let clickCount = 0;
    let clickTimeout;

    function showLauncher() {
      launcher.classList.add('active');
      urlInput.focus();
    }

    function openUrl() {
      const rawUrl = urlInput.value.trim();
      if (!rawUrl) {
        return;
      }

      window.location.href = `/view?url=${encodeURIComponent(rawUrl)}`;
    }

    document.addEventListener('click', () => {
      clickCount += 1;

      clearTimeout(clickTimeout);
      if (clickCount === 3) {
        showLauncher();
        clickCount = 0;
        return;
      }

      clickTimeout = setTimeout(() => {
        clickCount = 0;
      }, 500);
    });

    urlInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        openUrl();
      }
    });

    openButton.addEventListener('click', openUrl);
  </script>
</body>
</html>
