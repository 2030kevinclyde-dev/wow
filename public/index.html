<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      align-items: center;
      background: #fff;
      display: flex;
      height: 100vh;
      justify-content: center;
      width: 100%;
    }

    #linkInput {
      border: 1px solid #cfcfcf;
      display: none;
      font: 14px Arial, sans-serif;
      outline: none;
      padding: 7px 8px;
      width: 280px;
    }

    #linkInput.show {
      display: block;
    }
  </style>
</head>
<body>
  <input id="linkInput" type="text" autocomplete="off" />

  <script>
    const linkInput = document.getElementById('linkInput');
    let clicks = 0;
    let timer;

    function revealInput() {
      linkInput.classList.add('show');
      linkInput.focus();
    }

    document.addEventListener('click', () => {
      clicks += 1;
      clearTimeout(timer);

      if (clicks === 3) {
        revealInput();
        clicks = 0;
        return;
      }

      timer = setTimeout(() => {
        clicks = 0;
      }, 450);
    });

    linkInput.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter') {
        return;
      }

      const rawUrl = linkInput.value.trim();
      if (!rawUrl) {
        return;
      }

      window.location.href = `/go?url=${encodeURIComponent(rawUrl)}`;
    });
  </script>
</body>
</html>
