<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hidden Proxy Launcher</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      align-items: center;
      background: #050505;
      color: #fff;
      display: flex;
      font-family: Arial, sans-serif;
      height: 100vh;
      justify-content: center;
      overflow: hidden;
      width: 100%;
    }

    .blank-area {
      height: 100%;
      inset: 0;
      position: fixed;
      width: 100%;
    }

    .container {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 10px 45px rgba(0, 0, 0, 0.35);
      color: #1c1c1c;
      display: none;
      left: 50%;
      max-width: 720px;
      padding: 28px;
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(90vw, 720px);
      z-index: 2;
    }

    .container.active {
      animation: pop-in 180ms ease-out;
      display: block;
    }

    @keyframes pop-in {
      from {
        opacity: 0;
        transform: translate(-50%, -48%);
      }
      to {
        opacity: 1;
        transform: translate(-50%, -50%);
      }
    }

    h1 {
      font-size: 20px;
      margin-bottom: 16px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    input[type='text'] {
      border: 2px solid #d6d6d6;
      border-radius: 6px;
      flex: 1;
      font-size: 14px;
      padding: 11px 12px;
    }

    input[type='text']:focus {
      border-color: #2b2b2b;
      outline: none;
    }

    button {
      background: #1f1f1f;
      border: 0;
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      padding: 11px 20px;
    }

    .hint {
      color: #666;
      font-size: 12px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="blank-area" aria-label="Blank page"></div>

  <div class="container" id="proxyLauncher">
    <h1>Enter a link to open in the proxy</h1>
    <div class="input-group">
      <input id="urlInput" type="text" placeholder="https://example.com" />
      <button id="openProxyButton" type="button">Open</button>
    </div>
    <p class="hint">Triple-click anywhere on the blank page to reveal this input.</p>
  </div>

  <script>
    const launcher = document.getElementById('proxyLauncher');
    const urlInput = document.getElementById('urlInput');
    const openProxyButton = document.getElementById('openProxyButton');

    let clickCount = 0;
    let clickTimeout;

    function showLauncher() {
      launcher.classList.add('active');
      urlInput.focus();
    }

    function openProxy() {
      const rawUrl = urlInput.value.trim();
      if (!rawUrl) {
        window.alert('Please enter a link first.');
        return;
      }

      window.location.href = `/proxy.html?url=${encodeURIComponent(rawUrl)}`;
    }

    document.addEventListener('click', () => {
      clickCount += 1;

      clearTimeout(clickTimeout);
      if (clickCount === 3) {
        showLauncher();
        clickCount = 0;
        return;
      }

      clickTimeout = setTimeout(() => {
        clickCount = 0;
      }, 500);
    });

    urlInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        openProxy();
      }
    });

    openProxyButton.addEventListener('click', openProxy);
  </script>
</body>
</html>
