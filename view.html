<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #111;
      color: #eaeaea;
      display: grid;
      font-family: Arial, sans-serif;
      grid-template-rows: auto 1fr;
      height: 100vh;
    }

    .toolbar {
      align-items: center;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      display: flex;
      gap: 10px;
      padding: 10px;
    }

    .toolbar input {
      background: #000;
      border: 1px solid #444;
      border-radius: 6px;
      color: #fff;
      flex: 1;
      padding: 9px 10px;
    }

    .toolbar input:focus {
      border-color: #666;
      outline: none;
    }

    .toolbar button {
      background: #2f6df6;
      border: none;
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      font-weight: 700;
      padding: 9px 16px;
    }

    .toolbar button:hover {
      background: #4d7ff7;
    }

    iframe {
      background: #fff;
      border: none;
      height: 100%;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <input id="urlInput" type="text" placeholder="https://example.com" />
    <button id="goButton" type="button">Go</button>
  </div>
  <iframe id="frame" title="Content"></iframe>

  <script>
    const input = document.getElementById('urlInput');
    const goButton = document.getElementById('goButton');
    const frame = document.getElementById('frame');

    function loadUrl(rawUrl) {
      if (!rawUrl) {
        return;
      }
      input.value = rawUrl;
      frame.src = `/load?url=${encodeURIComponent(rawUrl)}`;
    }

    function start() {
      loadUrl(input.value.trim());
    }

    const params = new URLSearchParams(window.location.search);
    loadUrl(params.get('url') || '');

    goButton.addEventListener('click', start);
    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        start();
      }
    });
  </script>
</body>
</html>
